# fly.toml app configuration file generated for xirtam

app = "xirtam-bot"
primary_region = "iad"

[build]

# No mounts needed for MongoDB Atlas (External DB)
# If using self-hosted on Fly, you'd add one back.

[env]
  # Placeholder for MONGO_URI
  # MONGO_URI = "mongodb+srv://..."

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
